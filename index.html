<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Lãi Suất</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hiệu ứng nền -->
  <div class="bubbles">
    <div class="bubble"></div><div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
  </div>

  <!-- Ứng dụng chính -->
  <div id="appContainer" class="container">
    
    <div class="top-bar glass-card">
      <h1 data-i18n="appTitle">Quản Lý Lãi Suất</h1>
      <div class="actions-group">
        <div class="lang-switch">
          <button class="lang-btn active" id="btn-vi" onclick="setLang('vi')">🇻🇳 VN</button>
          <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 EN</button>
        </div>
        <button class="btn btn-glass" onclick="requestNotification()">🔔 <span data-i18n="btnNotify">Bật Thông Báo</span></button>
      </div>
    </div>

    <div class="dashboard">
      <div class="stat-card">
        <h3 data-i18n="statPrincipal">Tổng Tiền Cho Vay</h3>
        <p class="val" id="totalPrincipal">0 đ</p>
      </div>
      <div class="stat-card c-success">
        <h3 data-i18n="statInterest">Dự Kiến Lãi Tháng Này</h3>
        <p class="val" id="totalInterest">0 đ</p>
      </div>
      <div class="stat-card c-warning">
        <h3 data-i18n="statPeople">Số Hợp Đồng</h3>
        <p class="val" id="totalPeople">0</p>
      </div>
    </div>

    <div class="glass-card" style="margin-bottom: 30px;">
      <h2 style="margin-bottom: 20px; font-size: 18px;" data-i18n="formTitle">+ Thêm Hợp Đồng Mới</h2>
      <div class="form-grid">
        <div class="input-group">
          <label data-i18n="lbName">Tên người vay</label>
          <input type="text" id="name" data-i18n-ph="phName">
        </div>
        <div class="input-group">
          <label data-i18n="lbAmount">Số tiền gốc</label>
          <input type="text" id="amount" data-i18n-ph="phAmount" oninput="formatMoneyInput(this)">
        </div>
        <div class="input-group">
          <label data-i18n="lbRate">Lãi suất tháng (%)</label>
          <input type="text" id="rate" data-i18n-ph="phRate">
        </div>
        <div class="input-group">
          <label data-i18n="lbDay">Ngày đóng (1-31)</label>
          <input type="number" id="payDay" data-i18n-ph="phDay" min="1" max="31">
        </div>
      </div>
      <div style="margin-top: 25px; text-align: right;">
        <button class="btn btn-primary" onclick="addPerson()" data-i18n="btnSave">Lưu Hợp Đồng</button>
      </div>
    </div>

    <div class="glass-card">
      <h2 style="font-size: 18px;" data-i18n="tableTitle">Danh Sách Theo Dõi</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th data-i18n="thName">Họ Tên</th>
              <th data-i18n="thPrincipal">Tiền Gốc</th>
              <th data-i18n="thRate">Lãi Suất</th>
              <th data-i18n="thInterest">Tiền Lãi/Tháng</th>
              <th data-i18n="thDate">Ngày Thu</th>
              <th data-i18n="thStatus">Trạng Thái</th>
              <th data-i18n="thAction">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="loanTable"></tbody>
        </table>
        <div id="emptyState" class="empty-state" data-i18n="emptyState">
          Chưa có dữ liệu. Hãy thêm hợp đồng mới.
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
