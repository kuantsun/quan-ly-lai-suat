<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Nhắc Nợ & Lãi Suất</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 24px; color: var(--text); }
    
    .dashboard-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .summary-card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-left: 5px solid var(--primary); }
    .summary-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-light); text-transform: uppercase; }
    .summary-card .value { font-size: 24px; font-weight: bold; margin: 0; }
    .summary-card.success { border-left-color: var(--success); }
    .summary-card.success .value { color: var(--success); }
    
    .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-light); }
    .form-group input { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    
    button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-notify { background: #fff; border: 1px solid var(--primary); color: var(--primary); display: flex; align-items: center; gap: 8px;}
    .btn-notify:hover { background: #f5f3ff; }
    .btn-delete { background: #fee2e2; color: var(--danger); padding: 6px 12px; }
    .btn-delete:hover { background: #fecaca; }
    
    .form-actions { margin-top: 15px; display: flex; justify-content: flex-end; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--border); padding: 12px; text-align: left; }
    th { color: var(--text-light); font-weight: 600; background: #f9fafb; }
    tr:hover { background-color: #f9fafb; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-danger { background: #fee2e2; color: var(--danger); }
    .badge-warning { background: #fef3c7; color: var(--warning); }
    .badge-success { background: #d1fae5; color: var(--success); }
    
    .empty-state { text-align: center; padding: 30px; color: var(--text-light); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Hệ Thống Quản Lý Nhắc Nợ</h1>
      <button class="btn-notify" onclick="requestNotification()">
        🔔 Bật thông báo
      </button>
    </div>

    <!-- Bảng Tóm Tắt (Dashboard Summary) -->
    <div class="dashboard-summary">
      <div class="summary-card">
        <h3>Tổng Tiền Cho Vay</h3>
        <p class="value" id="totalPrincipal">0 đ</p>
      </div>
      <div class="summary-card success">
        <h3>Dự Kiến Lãi Thu Tháng Này</h3>
        <p class="value" id="totalInterest">0 đ</p>
      </div>
      <div class="summary-card" style="border-left-color: var(--warning);">
        <h3>Số Người Đang Vay</h3>
        <p class="value" id="totalPeople" style="color: var(--warning);">0</p>
      </div>
    </div>

    <!-- Form Thêm Người Vay -->
    <div class="card">
      <h2>+ Thêm Hợp Đồng Mới</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Tên người vay</label>
          <input type="text" id="name" placeholder="Ví dụ: Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label>Số tiền gốc (VNĐ)</label>
          <input type="number" id="amount" placeholder="Ví dụ: 10000000">
        </div>
        <div class="form-group">
          <label>Lãi suất tháng (%)</label>
          <input type="number" id="rate" placeholder="Ví dụ: 2.5" step="0.1">
        </div>
        <div class="form-group">
          <label>Ngày đóng lãi (1-31)</label>
          <input type="number" id="payDay" placeholder="Ví dụ: 15" min="1" max="31">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="addPerson()">Lưu Hợp Đồng</button>
      </div>
    </div>

    <!-- Danh Sách Quản Lý -->
    <div class="card" style="overflow-x: auto;">
      <h2>Danh Sách Theo Dõi Lãi Suất</h2>
      <table>
        <thead>
          <tr>
            <th>Họ Tên</th>
            <th>Tiền Gốc</th>
            <th>Lãi Suất</th>
            <th>Tiền Lãi/Tháng</th>
            <th>Ngày Thu</th>
            <th>Trạng Thái</th>
            <th>Thao Tác</th>
          </tr>
        </thead>
        <tbody id="loanTable">
          <!-- Render data here -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display: none;">
        Chưa có dữ liệu người vay. Hãy thêm mới ở form phía trên.
      </div>
    </div>
  </div>

  <script>
    let loans = JSON.parse(localStorage.getItem('myLoans')) || [];

    // Format tiền tệ chuẩn Việt Nam
    const formatCurrency = (num) => {
      return num.toLocaleString('vi-VN') + ' đ';
    };

    function requestNotification() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('Đã cấp quyền thông báo thành công!');
            checkTodayReminders(true); // Bỏ qua check lịch sử để test
          } else {
            alert('Bạn đã từ chối quyền thông báo.');
          }
        });
      } else {
        alert('Trình duyệt của bạn không hỗ trợ tính năng này.');
      }
    }

    function updateDashboard() {
      const totalPrincipal = loans.reduce((sum, loan) => sum + loan.amount, 0);
      const totalInterest = loans.reduce((sum, loan) => sum + loan.monthlyInterest, 0);
      
      document.getElementById('totalPrincipal').textContent = formatCurrency(totalPrincipal);
      document.getElementById('totalInterest').textContent = formatCurrency(totalInterest);
      document.getElementById('totalPeople').textContent = loans.length;
    }

    function addPerson() {
      const name = document.getElementById('name').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);
      const payDay = parseInt(document.getElementById('payDay').value);

      if (!name || isNaN(amount) || isNaN(rate) || isNaN(payDay) || payDay < 1 || payDay > 31) {
        alert('Vui lòng nhập đúng và đầy đủ thông tin! (Ngày đóng lãi từ 1-31)');
        return;
      }

      const monthlyInterest = amount * (rate / 100);

      const person = {
        id: Date.now(),
        name,
        amount,
        rate,
        monthlyInterest,
        payDay
      };

      loans.push(person);
      saveData();
      renderTable();
      clearForm();
      checkTodayReminders(false);
    }

    function deletePerson(id) {
      if(confirm('Bạn có chắc chắn muốn xóa hợp đồng này?')) {
        loans = loans.filter(item => item.id !== id);
        saveData();
        renderTable();
      }
    }

    function saveData() {
      localStorage.setItem('myLoans', JSON.stringify(loans));
      updateDashboard();
    }

    function renderTable() {
      const tbody = document.getElementById('loanTable');
      const emptyState = document.getElementById('emptyState');
      tbody.innerHTML = '';

      if(loans.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      const today = new Date();
      const currentDay = today.getDate();
      // Thuật toán: Lấy số ngày của tháng hiện tại (Xử lý tháng 2, các tháng 30 ngày)
      const daysInCurrentMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

      // Sắp xếp ưu tiên: Đến hạn -> Quá hạn -> Sắp tới
      let sortedLoans = [...loans].sort((a, b) => a.payDay - b.payDay);

      sortedLoans.forEach(item => {
        // Nếu ngày hẹn lớn hơn số ngày trong tháng (VD: hẹn ngày 31 nhưng tháng có 30 ngày)
        // -> Ngày thu thực tế sẽ là ngày cuối cùng của tháng (ngày 30).
        let actualPayDay = item.payDay > daysInCurrentMonth ? daysInCurrentMonth : item.payDay;
        
        let statusHtml = '';
        if (currentDay === actualPayDay) {
          statusHtml = `<span class="badge badge-warning">Hôm nay đến hạn!</span>`;
        } else if (currentDay > actualPayDay) {
          statusHtml = `<span class="badge badge-danger">Quá hạn ${currentDay - actualPayDay} ngày</span>`;
        } else {
          statusHtml = `<span class="badge badge-success">Còn ${actualPayDay - currentDay} ngày</span>`;
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>${formatCurrency(item.amount)}</td>
          <td>${item.rate}%</td>
          <td style="color: var(--success); font-weight: 600;">${formatCurrency(item.monthlyInterest)}</td>
          <td>Ngày ${actualPayDay}</td>
          <td>${statusHtml}</td>
          <td><button class="btn-delete" onclick="deletePerson(${item.id})">Xóa</button></td>
        `;
        tbody.appendChild(row);
      });
    }

    // Hàm kiểm tra nhắc nhở (Có cơ chế chống spam)
    function checkTodayReminders(forceNotify = false) {
      if (Notification.permission !== 'granted') return;

      const todayStr = new Date().toDateString();
      const lastNotified = localStorage.getItem('lastNotifiedDate');

      // Đảm bảo chỉ thông báo 1 lần mỗi ngày trừ khi forceNotify = true
      if (lastNotified === todayStr && !forceNotify) return;

      const today = new Date();
      const currentDay = today.getDate();
      const daysInCurrentMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();

      let notifyCount = 0;

      loans.forEach(item => {
        let actualPayDay = item.payDay > daysInCurrentMonth ? daysInCurrentMonth : item.payDay;
        if (actualPayDay === currentDay) {
          new Notification('📢 Đến hạn thu tiền lãi!', {
            body: `Đến hạn thu ${formatCurrency(item.monthlyInterest)} từ ${item.name}.`,
            icon: 'https://cdn-icons-png.flaticon.com/512/2953/2953363.png' // Icon minh họa
          });
          notifyCount++;
        }
      });

      if (notifyCount > 0) {
        localStorage.setItem('lastNotifiedDate', todayStr);
      }
    }

    function clearForm() {
      document.getElementById('name').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('rate').value = '';
      document.getElementById('payDay').value = '';
    }

    // Khởi tạo ứng dụng
    updateDashboard();
    renderTable();
    
    // Tự động check khi vừa load trang
    setTimeout(() => checkTodayReminders(false), 2000); 

  </script>
</body>
</html>
